modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

authors="${mod_authors}" #optional

description='''${mod_description}'''
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]] #optional
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Shared library; this mod is client-only, so only clients need it
[[dependencies.${mod_id}]]
    modId="camafy"
    mandatory=true
    versionRange="${camafy_version_range}"
    ordering="AFTER"
    side="CLIENT"

# No Conflict tells Camafy which physical keys it routes, and the overlay asks Camafy, so
# managed keybinds show their real key. No code link: this entry only orders loading.
[[dependencies.${mod_id}]]
    modId="noconflict"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"